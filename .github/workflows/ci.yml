name: Build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Protocol tests
        run: swift test
      - name: Build universal app
        run: ./script/build_app.sh --release --universal
      - name: Verify bundle
        run: |
          plutil -lint "dist/Govee Mac.app/Contents/Info.plist"
          codesign --verify --strict "dist/Govee Mac.app"
          lipo -verify_arch arm64 x86_64 "dist/Govee Mac.app/Contents/MacOS/GoveeMac"
          ditto -c -k --sequesterRsrc --keepParent "dist/Govee Mac.app" dist/Govee-Mac-universal.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Govee-Mac-universal
          path: dist/Govee-Mac-universal.zip
          if-no-files-found: error
